services:
    spf5000es-server:
        image: ghcr.io/rany2/spf5000es-server:master
        container_name: spf5000es-server
        restart: unless-stopped
        volumes:
            - ./config.ini:/app/config.ini:ro
        security_opt:
            - no-new-privileges:true
        devices:
            - /dev/ttyUSB0:/dev/ttyUSB0
